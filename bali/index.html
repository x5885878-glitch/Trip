  var d=TRIP_DATA[dayIdx];
  if(!d)return [];
  var dateKey=(d.date||'').split(' ')[0];  // e.g. "9/26"
  // Helper: parse "M/D" into ordinal day-of-year-ish for range comparison
  function dateOrd(s){
    var m=s.match(/(\d+)\/(\d+)/);
    if(!m)return 0;
    return parseInt(m[1],10)*100 + parseInt(m[2],10);
  }
  var keyOrd = dateOrd(dateKey);
  return PLACES.filter(function(p){
    if(!p.d)return false;
    // Strip time-of-day suffix: 上午/下午/中午/晚上/早晨/傍晚/午餐/早餐/晚餐
    var pDate = p.d.replace(/\s+(上午|下午|中午|晚上|早晨|傍晚|午餐|早餐|晚餐).*$/, '');
    // Comma-separated multiple dates
    if(pDate.indexOf(',')>=0){
      return pDate.split(',').map(function(s){return s.trim();}).indexOf(dateKey)>=0;
    }
    // Date range with – or -
    var sep = pDate.indexOf('–')>=0 ? '–' : (pDate.indexOf('-')>=0 ? '-' : null);
    if(sep){
      var parts=pDate.split(sep);
      var startOrd=dateOrd(parts[0].trim()), endOrd=dateOrd(parts[1].trim());
      // Inclusive range check
      return keyOrd>=startOrd && keyOrd<=endOrd;
    }
    return pDate===dateKey;
  });
}

function renderMap(dayIdx){
  if(!GMAPS_READY){loadGMaps();
    var inner=$id('map-inner');
    if(inner)inner.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--txt2);font-size:12px">載入地圖中...</div>';
    return;
  }
  var inner=$id('map-inner'); if(!inner)return;
  var places=getDayPlaces(dayIdx);
  if(places.length===0){
    inner.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--txt2);font-size:12px">這天沒有地圖資料</div>';
    return;
  }
  inner.innerHTML='';
  var center={lat:places[0].lat,lng:places[0].lng};
  var darkStyle=[
    {elementType:'geometry',stylers:[{color:'#0a0e1a'}]},
    {elementType:'labels.text.stroke',stylers:[{color:'#0a0e1a'}]},
    {elementType:'labels.text.fill',stylers:[{color:'#9ca3af'}]},
    {featureType:'road',elementType:'geometry',stylers:[{color:'#1e2235'}]},
    {featureType:'road',elementType:'labels.text.fill',stylers:[{color:'#6b7280'}]},
    {featureType:'water',elementType:'geometry',stylers:[{color:'#141827'}]},
    {featureType:'poi',stylers:[{visibility:'off'}]},
    {featureType:'administrative',elementType:'geometry',stylers:[{color:'#1e2235'}]},
    {featureType:'landscape',elementType:'geometry',stylers:[{color:'#0f1320'}]},
    {featureType:'transit',stylers:[{visibility:'off'}]}
  ];
  mapInst=new google.maps.Map(inner,{
    center:center, zoom:11,
    styles:darkStyle,
    disableDefaultUI:true, zoomControl:true, gestureHandling:'greedy'
  });
  var bounds=new google.maps.LatLngBounds();
  places.forEach(function(p,i){
    var m=new google.maps.Marker({
      position:{lat:p.lat,lng:p.lng}, map:mapInst,
      label:{text:String(i+1),color:'#0a0e1a',fontWeight:'600'},
      title:p.n
    });
    var iw=new google.maps.InfoWindow({
      content:'<div style="color:#0a0e1a;font-size:13px;font-family:system-ui;max-width:240px"><b>'+escHtml(p.n)+'</b><div style="font-size:11px;color:#374151;margin-top:4px">'+escHtml(p.x||'')+'</div><a href="https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng+'" target="_blank" style="display:inline-block;margin-top:8px;font-size:12px;color:#2563eb;text-decoration:none">🧭 導航</a></div>'
    });
    m.addListener('click',function(){iw.open(mapInst,m);});
    bounds.extend(new google.maps.LatLng(p.lat,p.lng));
  });
  if(places.length>1){
    mapInst.fitBounds(bounds);
    setTimeout(function(){if(mapInst.getZoom()>14)mapInst.setZoom(14);},200);
  }
}

// ─── FIREBASE SYNC ─────────────────────────────────────────────────────────
function setSync(state){
  var dot=$id('sync-dot'), text=$id('sync-text'), badge=$id('sync-badge');
  if(!dot||!text||!badge)return;
  badge.classList.remove('syncing','ok','err');
  if(state==='syncing'){dot.textContent='◌';text.textContent='同步中';badge.classList.add('syncing');}
  else if(state==='ok'){dot.textContent='●';text.textContent='已同步';badge.classList.add('ok');}
  else if(state==='err'){dot.textContent='⚠';text.textContent='同步失敗';badge.classList.add('err');}
  else {dot.textContent='○';text.textContent='待同步';}
}

// ─── FIREBASE AUTH ────────────────────────────────────────────────────────
function loadAuthFromStorage(){
  try{
    var s=localStorage.getItem(AUTH_STORAGE_KEY);
    if(!s)return null;
    return JSON.parse(s);
  }catch(e){return null;}
}
function saveAuth(idToken,refreshToken,expiresIn){
  var wasLoggedOut = !state.idToken;
  state.idToken=idToken;
  state.refreshToken=refreshToken;
  state.idTokenExpiry=Date.now()+(parseInt(expiresIn,10)*1000);
  try{
    localStorage.setItem(AUTH_STORAGE_KEY,JSON.stringify({
      idToken:idToken,refreshToken:refreshToken,expiry:state.idTokenExpiry
    }));
  }catch(e){}
  updateAuthBadge();
  // Just transitioned from logged-out → logged-in. If Firebase data is
  // older than our HTML schema, push HTML baseline now so version + data
  // catch up. This avoids users wondering "why did I log in but Firebase
  // didn't update".
  if(wasLoggedOut){
    setTimeout(syncBaselineIfStale, 200);
  }
}
function syncBaselineIfStale(){
  if(!state.idToken)return;
  fbGet(FB_META).then(function(meta){
    var fbVer = (meta && meta.version) || 0;
    if(fbVer < DATA_VERSION){
      console.log('[v2] post-login baseline sync: Firebase v'+fbVer+' → HTML v'+DATA_VERSION);
      fbPut(FB_ITIN, TRIP_DATA);
      fbPut(FB_BOOK, BOOKING_DATA);
      fbPut(FB_CG, COST_GROUPS);
      fbPut(FB_META, {version:DATA_VERSION, ts:Date.now(), kind:'post-login-sync'});
      toast('資料已同步到雲端 ('+fbVer+'→'+DATA_VERSION+')');
    }
  });
}
function clearAuth(){
  state.idToken=null;state.refreshToken=null;state.idTokenExpiry=0;
  try{localStorage.removeItem(AUTH_STORAGE_KEY);}catch(e){}
  updateAuthBadge();
}
function signInWithPassword(password){
  return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FB_API_KEY,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:FB_APP_EMAIL,password:password,returnSecureToken:true})
  }).then(function(r){
    return r.json().then(function(d){
      if(!r.ok)return {ok:false,error:(d.error&&d.error.message)||'sign-in failed'};
      saveAuth(d.idToken,d.refreshToken,d.expiresIn);
      return {ok:true};
    });
  }).catch(function(e){return {ok:false,error:e.message};});
}
function refreshAuthToken(){
  if(!state.refreshToken)return Promise.resolve(false);
  return fetch('https://securetoken.googleapis.com/v1/token?key='+FB_API_KEY,{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(state.refreshToken)
  }).then(function(r){
    if(!r.ok){clearAuth();return false;}
    return r.json().then(function(d){
      saveAuth(d.id_token,d.refresh_token,d.expires_in);
      return true;
    });
  }).catch(function(){return false;});
}
function getAuthTokenAsync(){
  // No token at all — return null fast
  if(!state.idToken)return Promise.resolve(null);
  // Still valid (with 5min buffer)
  if(Date.now()<state.idTokenExpiry-5*60*1000)return Promise.resolve(state.idToken);
  // Need refresh
  return refreshAuthToken().then(function(ok){return ok?state.idToken:null;});
}
function updateAuthBadge(){
  var b=$id('auth-badge');if(!b)return;
  if(state.idToken){
    b.textContent='🔓 已登入';
    b.classList.add('authed');b.classList.remove('unauthed');
    b.title='點擊登出';
  } else {
    b.textContent='🔒 未登入';
    b.classList.add('unauthed');b.classList.remove('authed');
    b.title='點擊登入以啟用編輯';
  }
}
function showLoginModal(opts){
  opts=opts||{};
  if($id('login-modal'))return;
  var modal=document.createElement('div');
  modal.id='login-modal';modal.className='modal-overlay';
  modal.innerHTML=
    '<div class="modal-box" style="max-width:360px">'+
      '<div class="modal-header">🔐 登入以啟用編輯'+
        (opts.dismissible!==false?'<button class="modal-close" id="li-close">✕</button>':'')+
      '</div>'+
      '<div class="modal-body">'+
        (opts.reason?'<div class="mp-hint" style="color:var(--danger)">'+opts.reason+'</div>':
          '<div class="mp-hint">未登入時可瀏覽全部行程，但無法存編輯、勾選訂票或記費用</div>')+
        '<label style="display:block;font-size:11px;color:var(--txt3);margin-bottom:4px">Email</label>'+
        '<input type="email" id="li-email" value="'+FB_APP_EMAIL+'" disabled style="width:100%;padding:8px;background:var(--glass);border:1px solid var(--glass2);border-radius:6px;color:var(--txt3);font-family:inherit;margin-bottom:10px;box-sizing:border-box">'+
        '<label style="display:block;font-size:11px;color:var(--txt3);margin-bottom:4px">密碼</label>'+
        '<input type="password" id="li-password" autocomplete="current-password" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--accent);border-radius:6px;color:var(--txt);font-family:inherit;font-size:14px;margin-bottom:8px;box-sizing:border-box">'+
        '<div id="li-error" style="color:var(--danger);font-size:12px;min-height:16px"></div>'+
      '</div>'+
      '<div class="modal-footer">'+
        (opts.dismissible!==false?'<button class="modal-btn" id="li-cancel">稍後</button>':'')+
        '<button class="modal-btn primary" id="li-submit">登入</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(modal);
  setTimeout(function(){var p=$id('li-password');if(p)p.focus();},100);

  function closeModal(){
    var m=$id('login-modal');if(m&&m.parentNode)m.parentNode.removeChild(m);
  }
  function attempt(){
    var pw=$id('li-password').value;if(!pw)return;
    var btn=$id('li-submit');btn.disabled=true;btn.textContent='登入中...';
    var err=$id('li-error');err.textContent='';
    signInWithPassword(pw).then(function(r){
      if(r.ok){
        toast('已登入 ✓');closeModal();setSync('ok');
        // Retry any pending sync now that we have auth
        if(opts.retryAfterLogin)opts.retryAfterLogin();
      } else {
        err.textContent='登入失敗：'+r.error;
        btn.disabled=false;btn.textContent='登入';
      }
    });
  }
  var sb=$id('li-submit');if(sb)sb.addEventListener('click',attempt);
  var pw=$id('li-password');if(pw)pw.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();attempt();}
  });
  var cb=$id('li-cancel');if(cb)cb.addEventListener('click',closeModal);
  var xb=$id('li-close');if(xb)xb.addEventListener('click',closeModal);
}
function signOut(){
  if(!confirm('登出？編輯功能會停用，但仍可瀏覽行程。'))return;
  clearAuth();
  toast('已登出');
}
function initAuth(){
  var saved=loadAuthFromStorage();
  if(saved){
    state.idToken=saved.idToken;
    state.refreshToken=saved.refreshToken;
    state.idTokenExpiry=saved.expiry||0;
    updateAuthBadge();
    // Pre-emptive refresh if expiring soon (fire & forget)
    if(Date.now()>state.idTokenExpiry-10*60*1000){
      refreshAuthToken().then(function(ok){if(ok)syncBaselineIfStale();});
    } else {
      // Token still valid — check baseline after pullInitial has fetched meta
      setTimeout(syncBaselineIfStale, 2000);
    }
  } else {
    updateAuthBadge();
    // Don't auto-popup login modal on page load — user can browse read-only.
    // Modal triggers when they click 編輯 mode or auth-badge.
  }
}

// ─── FIREBASE REST WITH AUTH ──────────────────────────────────────────────
function fbPut(path,data){
  setSync('syncing');
  return getAuthTokenAsync().then(function(token){
    var url=FB_URL+'/'+path+'.json';
    if(token)url+='?auth='+encodeURIComponent(token);
    return fetch(url,{method:'PUT',body:JSON.stringify(data)}).then(function(r){
      if(r.status===401||r.status===403){
        // Token rejected — try one refresh + retry
        return refreshAuthToken().then(function(ok){
          if(!ok){
            setSync('err');
            showLoginModal({reason:'登入過期或寫入被拒，請重新登入',
              retryAfterLogin:function(){fbPut(path,data);}});
            throw new Error('auth required');
          }
          var url2=FB_URL+'/'+path+'.json?auth='+encodeURIComponent(state.idToken);
          return fetch(url2,{method:'PUT',body:JSON.stringify(data)}).then(function(r2){
            if(!r2.ok){
              if(r2.status===401||r2.status===403){
                setSync('err');
                showLoginModal({reason:'登入過期或寫入被拒，請重新登入',
                  retryAfterLogin:function(){fbPut(path,data);}});
              } else {
                setSync('err');
              }
              throw new Error('http '+r2.status);
            }
            setSync('ok');
          });
        });
      }
      if(!r.ok)throw new Error('http '+r.status);
      setSync('ok');
    });
  }).catch(function(e){
    setSync('err');console.warn('sync err',e);
  });
}
function fbGet(path){
  // Reads are public per current rules, no auth needed
  return fetch(FB_URL+'/'+path+'.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
}

var syncTodosDeb=null;
function syncTodos(){
  clearTimeout(syncTodosDeb);
  syncTodosDeb=setTimeout(function(){fbPut(FB_TODOS,state.todoStates);},400);
}
var syncCostsDeb=null;
function syncCosts(){
  clearTimeout(syncCostsDeb);
  syncCostsDeb=setTimeout(function(){fbPut(FB_COSTS,state.costActuals);},400);
}
var syncCGDeb=null;
function syncCostGroups(){
  clearTimeout(syncCGDeb);
  syncCGDeb=setTimeout(function(){
    fbPut(FB_CG, COST_GROUPS);
    fbPut(FB_META, {version:DATA_VERSION, ts:Date.now(), kind:'cg'});
  },600);
}
var syncFXDeb=null;
function syncFX(){
  clearTimeout(syncFXDeb);
  syncFXDeb=setTimeout(function(){fbPut(FB_FX,{nzd:state.fxRate});},400);
}
var syncItinDeb=null;
function syncItin(){
  clearTimeout(syncItinDeb);
  syncItinDeb=setTimeout(function(){
    fbPut(FB_ITIN, TRIP_DATA);
    fbPut(FB_META, {version:DATA_VERSION, ts:Date.now(), kind:'itin'});
  },600);
}
var syncBookDeb=null;
function syncBooking(){
  clearTimeout(syncBookDeb);
  syncBookDeb=setTimeout(function(){
    fbPut(FB_BOOK, BOOKING_DATA);
    fbPut(FB_META, {version:DATA_VERSION, ts:Date.now(), kind:'book'});
  },600);
}

function pullInitial(){
  setSync('syncing');
  Promise.all([
    fbGet(FB_TODOS), fbGet(FB_COSTS), fbGet(FB_ITIN),
    fbGet(FB_BOOK), fbGet(FB_CG), fbGet(FB_FX), fbGet(FB_META)
  ]).then(function(arr){
    var todos=arr[0],costs=arr[1],itin=arr[2],book=arr[3],cg=arr[4],fx=arr[5],meta=arr[6];
    if(todos)state.todoStates=todos;
    if(costs)state.costActuals=costs;
    if(fx && typeof fx==='object' && typeof fx.nzd==='number') state.fxRate=fx.nzd;

    var versionOK = meta && typeof meta==='object' && meta.version===DATA_VERSION;
    if(versionOK){
      if(itin && Array.isArray(itin) && itin.length>0){
        TRIP_DATA.length=0;
        for(var i=0;i<itin.length;i++)TRIP_DATA.push(itin[i]);
      }
      if(book && Array.isArray(book) && book.length>0){
        BOOKING_DATA.length=0;
        for(var i=0;i<book.length;i++)BOOKING_DATA.push(book[i]);
      }
      if(cg && Array.isArray(cg) && cg.length>0){
        COST_GROUPS.length=0;
        for(var i=0;i<cg.length;i++)COST_GROUPS.push(cg[i]);
      }
    } else {
      // Schema/data version mismatch. Push HTML baseline to Firebase.
      // BUT only if we have auth — otherwise writes 401 and triggers login modal
      // immediately on page load (annoying UX). HTML data is already loaded
      // locally; first edit (after login) will trigger writes that catch up.
      if(state.idToken){
        if(!meta || !meta.version){
          fbPut(FB_ITIN, TRIP_DATA);
          fbPut(FB_BOOK, BOOKING_DATA);
          fbPut(FB_CG, COST_GROUPS);
          fbPut(FB_META, {version:DATA_VERSION, ts:Date.now(), kind:'baseline'});
        } else {
          console.log('[v2] data version bump '+meta.version+' → '+DATA_VERSION+'; HTML data wins');
          fbPut(FB_ITIN, TRIP_DATA);
          fbPut(FB_BOOK, BOOKING_DATA);
          fbPut(FB_CG, COST_GROUPS);
          fbPut(FB_META, {version:DATA_VERSION, ts:Date.now(), kind:'upgrade'});
          toast('資料已更新到新版本');
        }
      } else {
        console.log('[v2] version mismatch ('+(meta&&meta.version)+' → '+DATA_VERSION+') but not logged in; HTML data used locally only');
      }
    }
    setSync('ok');
    renderTabs();
    renderPanel(state.curDay);
    bindTabEvents();
    updateProgress();
  });
}

// ─── INIT ──────────────────────────────────────────────────────────────────
function updateNZClock(){
  var el = document.getElementById('nz-clock-time');
  if(!el) return;
  try {
    var fmt = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Makassar',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
    var t = fmt.format(new Date());
    if(t !== el.textContent) el.textContent = t;
  } catch(e) {
    // Fallback for older browsers: compute UTC offset manually
    var d = new Date();
    var utc = d.getTime() + d.getTimezoneOffset()*60000;
    // Rough: NZ is UTC+12 (winter) or UTC+13 (summer)
    // From Sep last Sunday to Apr first Sunday = DST (+13)
    var m = d.getUTCMonth(), day = d.getUTCDate();
    var isDST = (m > 8 || (m===8 && day>=27)) || (m < 3) || (m===3 && day<=5);
    var nz = new Date(utc + (isDST?13:12)*3600000);
    var hh = String(nz.getHours()).padStart(2,'0');
    var mm = String(nz.getMinutes()).padStart(2,'0');
    el.textContent = hh+':'+mm;
  }
}
function updateStickyOffsets(){
  // Measure topbar + visible edit-banner to set sticky offset for day-tabs-wrap.
  // Fixes day-tabs disappearing under taller-than-60px topbar.
  var total=0;
  var banner=document.querySelector('.edit-banner');
  if(banner && getComputedStyle(banner).display!=='none'){
    total+=banner.offsetHeight;
  }
  var topbar=document.querySelector('.topbar');
  if(topbar)total+=topbar.offsetHeight;
  document.documentElement.style.setProperty('--topbar-h',total+'px');
}
function startNZClock(){
  updateNZClock();
  setInterval(updateNZClock, 1000);
}
function init(){
  initAuth();  // must run before pullInitial since it may trigger writes
  startNZClock();
  updateStickyOffsets();
  window.addEventListener('resize',updateStickyOffsets);
  // Re-measure after web fonts settle (badges row may grow when fonts load)
  setTimeout(updateStickyOffsets,500);
  setTimeout(updateStickyOffsets,1500);
  renderTabs();
  renderPanel(state.curDay);
  bindTabEvents();
  bindDragHandlers();
  bindGlobalClicks();
  bindSwipe();
  updateProgress();
  pullInitial();
  // Cost drag handlers bind once; cost-list is created lazily but the handler is on parent
  setTimeout(function(){
    if($id('cost-list'))bindCostDragHandlers();
    else {
      // Bind after first cost sheet open
      var origRender=renderCost;
      // Wrap once
      if(!window._costDragBound){
        window._costDragBound=true;
        var prevOpen=openSheet;
        openSheet=function(which){
          prevOpen(which);
          if(which==='cost' && !window._costDragBoundDone){
            window._costDragBoundDone=true;
            bindCostDragHandlers();
          }
        };
      }
    }
  },100);
  setTimeout(loadGMaps,800);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
} else {
  init();
}
