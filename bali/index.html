<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🌊 Bali 2026 — Xi++</title>
<style>
/* travel-app-v2 — styles.css
 * Midnight Explorer theme by default. Replace top CSS variables to
 * switch themes (see references/themes.md for swap-in values).
 * Generated from NZ 2026/09 trip live deployment (DATA_VERSION 5).
 */

:root{
  --bg:#0a0e1a; --bg2:#141827; --bg3:#1e2235;
  --glass:rgba(255,255,255,0.06); --glass2:rgba(255,255,255,0.10); --glass3:rgba(255,255,255,0.15);
  --txt:#e8e8ec; --txt2:#9ca3af; --txt3:#6b7280;
  --accent:#2dd4bf; --accent2:#8b5cf6; --warn:#fbbf24; --danger:#f87171; --ok:#34d399;
  --rad:14px; --rad2:10px; --rad3:6px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Outfit','Noto Sans TC',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;overscroll-behavior-y:none}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}
a{color:var(--accent);text-decoration:none}

/* TOPBAR */
.sticky-header{position:sticky;top:0;z-index:100}
.topbar{background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass);padding:14px 16px 10px}
.topbar h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block;letter-spacing:0.5px}
.topbar .sub{font-size:11px;color:var(--txt2);margin-top:2px}
.topbar .badges{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 10px;background:var(--glass);border:1px solid var(--glass2);border-radius:999px;color:var(--txt2)}
.badge.ok{color:var(--ok);border-color:rgba(52,211,153,0.3)}
.badge.warn{color:var(--warn);border-color:rgba(251,191,36,0.3)}

/* DAY TABS */
.day-tabs-wrap{background:rgba(10,14,26,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--glass);padding:8px 12px}
.day-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 12px;background:var(--glass);border:1px solid var(--glass2);border-radius:var(--rad2);cursor:pointer;transition:all 0.2s;min-width:62px;position:relative;font-family:inherit}
.day-tab:hover{background:var(--glass2);transform:translateY(-1px)}
.day-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 4px 14px rgba(45,212,191,0.3)}
.day-tab.active .dt-d{color:#0a0e1a;font-weight:600}
.day-tab.active .dt-wd{color:rgba(10,14,26,0.7)}
.dt-d{font-size:13px;font-weight:500;color:var(--txt);letter-spacing:0.3px}
.dt-wd{font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:0.5px}
.dt-icon{font-size:14px;margin-bottom:1px;line-height:1}

/* Drag handle on day-tab (edit mode only) */
.edit-mode .day-tab{cursor:grab}
.edit-mode .day-tab::after{content:'⠿';position:absolute;top:2px;right:4px;font-size:9px;color:var(--txt3);opacity:0.6}
.edit-mode .day-tab.dragging{opacity:0.4}
.edit-mode .day-tab.drag-over{box-shadow:0 0 0 2px var(--accent)}

/* PROGRESS BAR */
.progress-bar{height:2px;background:var(--glass);position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width 0.4s ease}

/* DAY PANEL */
.day-panel{display:none;padding:14px 14px 110px;animation:slideIn 0.3s ease}
.day-panel.active{display:block}
@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}

.dp-header{margin-bottom:12px}
.dp-title{font-size:18px;font-weight:600;color:var(--txt);margin-bottom:2px}
.dp-sub{font-size:12px;color:var(--txt2)}

.dp-toggle{display:flex;gap:0;background:var(--glass);border-radius:var(--rad2);padding:3px;margin:12px 0}
.dp-btn{flex:1;padding:8px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--txt2);cursor:pointer;transition:all 0.2s;background:transparent}
.dp-btn.active{background:var(--glass2);color:var(--txt)}

/* CARDS */
.card{position:relative;background:var(--glass);border:1px solid var(--glass2);border-radius:var(--rad);padding:14px;margin-bottom:10px;transition:all 0.2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card:hover{background:var(--glass2);border-color:var(--glass3);transform:translateY(-1px)}
.card .ct{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.c-time{font-size:16px;font-weight:600;color:var(--accent);min-width:50px;letter-spacing:0.3px}
.c-icon{font-size:18px;line-height:1}
.c-name{font-size:14px;font-weight:500;color:var(--txt);flex:1;line-height:1.45}
.c-desc{font-size:12px;color:var(--txt2);margin-top:4px;line-height:1.5}
.c-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.c-tag{font-size:10px;padding:2px 8px;background:var(--glass);border:1px solid var(--glass2);border-radius:999px;color:var(--txt2)}
.c-tag.book{color:var(--warn);border-color:rgba(251,191,36,0.3)}
.c-tag.done{color:var(--ok);border-color:rgba(52,211,153,0.3)}

/* Quick actions */
.c-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--glass)}
.c-act{font-size:11px;padding:4px 10px;background:var(--glass);border:1px solid var(--glass2);border-radius:999px;color:var(--txt2);cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:3px}
.c-act:hover{background:var(--glass2);color:var(--txt)}

/* Card details (推薦地點) */
.card-expand-btn{margin-top:6px;font-size:11px;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.card-details{display:none;margin-top:8px;padding:10px;background:var(--glass);border-radius:var(--rad3);font-size:12px;color:var(--txt2);line-height:1.7}
.card-details.show{display:block;animation:slideDown 0.2s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

/* Add-between (edit mode only) */
.card-add-between{display:none;text-align:center;padding:6px;margin:-2px 0;font-size:11px;color:var(--accent);cursor:pointer;border:1px dashed transparent;border-radius:var(--rad3);transition:all 0.15s}
.edit-mode .card-add-between{display:block;border-color:var(--glass2)}
.card-add-between:hover{background:var(--glass);border-color:var(--accent)}

/* Hotel card */
.card-hotel{background:linear-gradient(135deg,rgba(139,92,246,0.08),rgba(45,212,191,0.05));border-color:rgba(139,92,246,0.2)}
.card-hotel .ct{align-items:center}
.hotel-grid{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.h-icon{font-size:22px}
.h-name{font-size:14px;font-weight:500;color:var(--txt)}
.h-desc{font-size:11px;color:var(--txt2);margin-top:2px}
.h-price{font-size:13px;color:var(--accent);font-weight:500;text-align:right;white-space:nowrap}

/* EDIT MODE indicators */
.edit-mode .card{padding-right:36px}
.edit-mode .card .c-time,.edit-mode .card .c-name,.edit-mode .card .c-desc,.edit-mode .card .h-name,.edit-mode .card .h-desc,.edit-mode .card .h-price{cursor:text;border-radius:4px}
.edit-mode .card .c-time:hover,.edit-mode .card .c-name:hover,.edit-mode .card .c-desc:hover,.edit-mode .card .h-name:hover,.edit-mode .card .h-desc:hover,.edit-mode .card .h-price:hover{background:var(--glass2);outline:1px solid var(--accent)}
.edit-input{width:100%;padding:4px 6px;background:var(--bg2);border:1px solid var(--accent);border-radius:4px;color:var(--txt);font-size:inherit;font-family:inherit}

.card-drag-handle{display:none;position:absolute;left:6px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:12px;cursor:grab;user-select:none}
.edit-mode .card .card-drag-handle{display:block}
.edit-mode .card{padding-left:28px}
.card.dragging{opacity:0.4}
.card.drag-over{box-shadow:0 0 0 2px var(--accent)}

.card-del{display:none;position:absolute;right:8px;top:8px;width:24px;height:24px;background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.3);border-radius:50%;color:var(--danger);font-size:14px;line-height:22px;text-align:center;cursor:pointer;transition:all 0.15s}
.edit-mode .card-del{display:block}
.card-del:hover{background:var(--danger);color:#fff}

/* Map container */
.dp-map{display:none;border-radius:var(--rad);overflow:hidden;border:1px solid var(--glass2);height:60vh;min-height:400px;margin-top:8px;position:relative;background:var(--bg2)}
.dp-map.active{display:block}
.dp-map-inner{width:100%;height:100%}
.dp-itin.hidden{display:none}

/* BOTTOM NAV */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(10,14,26,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--glass);display:flex;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;cursor:pointer;border-radius:var(--rad3);color:var(--txt3);transition:all 0.15s;background:none;border:none;font-family:inherit}
.bnav-btn.active{color:var(--accent)}
.bnav-btn:hover{color:var(--txt2)}
.bnav-btn.active:hover{color:var(--accent)}
.bnav-icon{font-size:18px;line-height:1}
.bnav-label{font-size:10px;font-weight:500;letter-spacing:0.3px}

/* BOTTOM SHEETS */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet-overlay.show{display:block;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:201;background:var(--bg2);border-top-left-radius:20px;border-top-right-radius:20px;max-height:85vh;display:none;flex-direction:column;animation:slideUp 0.3s cubic-bezier(0.2,0.8,0.2,1)}
.sheet.show{display:flex}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--glass3);border-radius:2px;margin:8px auto 4px;flex-shrink:0}
.sheet-header{padding:6px 18px 12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-bottom:1px solid var(--glass)}
.sheet-title{font-size:16px;font-weight:600;color:var(--txt)}
.sheet-close{font-size:20px;color:var(--txt2);cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px}
.sheet-close:hover{background:var(--glass)}
.sheet-body{flex:1;overflow-y:auto;padding:14px 18px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* BOOKING SHEET */
.bs-section{margin-bottom:14px}
.bs-section-title{font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:6px;padding-left:2px}
.bs-todo{display:flex;align-items:flex-start;gap:10px;padding:10px;background:var(--glass);border:1px solid var(--glass);border-radius:var(--rad2);margin-bottom:6px;cursor:pointer;transition:all 0.15s}
.bs-todo:hover{background:var(--glass2)}
.bs-todo-cb{width:18px;height:18px;border-radius:4px;border:2px solid var(--txt3);flex-shrink:0;margin-top:1px;transition:all 0.15s;display:flex;align-items:center;justify-content:center;font-size:12px;color:#0a0e1a}
.bs-todo.done .bs-todo-cb{background:var(--accent);border-color:var(--accent)}
.bs-todo.done .bs-todo-cb::after{content:'✓'}
.bs-todo-text{flex:1;font-size:13px;color:var(--txt);line-height:1.45}
.bs-todo.done .bs-todo-text{color:var(--txt3);text-decoration:line-through}
.bs-todo-text b{font-weight:500;color:var(--txt)}
.bs-todo.done .bs-todo-text b{color:var(--txt3)}
.bs-todo-del{display:none;color:var(--danger);font-size:14px;cursor:pointer;padding:0 4px}
.edit-mode .bs-todo .bs-todo-del{display:block}

/* Add new todo (smart categorization) */
.bs-add-row{margin-top:10px;padding:10px;background:var(--glass);border-radius:var(--rad2);border:1px dashed var(--glass3)}
.bs-add-row input,.bs-add-row select{background:var(--bg);border:1px solid var(--glass2);border-radius:6px;padding:8px 10px;color:var(--txt);font-size:13px;width:100%}
.bs-add-row .row{display:flex;gap:6px;margin-bottom:6px}
.bs-add-row select{flex:0 0 100px}
.bs-add-row input{flex:1}
.bs-add-btn{margin-top:4px;width:100%;padding:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0e1a;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}

/* COST SHEET */
.cs-group{margin-bottom:14px}
.cs-group-title{font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:6px;padding-left:2px}
.cs-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--glass);border-radius:var(--rad3);margin-bottom:4px;font-size:13px}
.cs-row .cl{flex:1;color:var(--txt);padding-right:8px}
.cs-row .csub{display:block;font-size:11px;color:var(--txt3);margin-top:2px}
.cs-row .am{color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;padding:2px 4px;border-radius:4px;white-space:nowrap}
.cs-row .am.has-actual{color:var(--ok);font-weight:600}
.cs-row .am:hover{background:var(--glass2)}
.cs-row .am.editing{outline:1px solid var(--accent);background:var(--bg)}
.cs-sub{display:flex;justify-content:space-between;padding:8px 10px;background:var(--glass2);border-radius:var(--rad3);margin-bottom:4px;font-size:13px;font-weight:600;color:var(--txt)}
.cs-sub .am{color:var(--accent)}
.cs-grand{display:flex;justify-content:space-between;align-items:center;padding:14px;background:linear-gradient(135deg,rgba(45,212,191,0.1),rgba(139,92,246,0.1));border:1px solid var(--accent);border-radius:var(--rad);margin-top:12px;font-size:15px;font-weight:600}
.cs-grand .am{color:var(--accent);font-size:18px;font-variant-numeric:tabular-nums}
.cs-summary{display:flex;gap:10px;margin-bottom:14px}
.cs-summary-card{flex:1;padding:10px;background:var(--glass);border-radius:var(--rad2);text-align:center}
.cs-summary-card .label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.cs-summary-card .value{font-size:15px;font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums}

.cost-hint{font-size:11px;color:var(--txt3);text-align:center;padding:6px;background:var(--glass);border-radius:6px;margin-bottom:10px}

/* Cost FX setting */
.cost-fx{display:flex;align-items:center;gap:6px;padding:10px;background:var(--glass);border-radius:var(--rad2);margin-bottom:10px;font-size:12px}
.cost-fx .fx-label{font-weight:600;color:var(--txt)}
.cost-fx .fx-pair{color:var(--txt2)}
.cost-fx input{background:var(--bg);border:1px solid var(--glass2);border-radius:6px;padding:4px 8px;color:var(--accent);font-weight:600;font-size:13px;font-family:inherit;text-align:right}
.cost-fx input:focus{outline:none;border-color:var(--accent)}
.cost-fx .fx-hint{margin-left:auto;font-size:10px;color:var(--txt3)}

/* Pull from itinerary button */
.cost-pull-btn{width:100%;padding:10px;background:linear-gradient(135deg,rgba(45,212,191,0.15),rgba(139,92,246,0.15));border:1px dashed var(--accent);border-radius:var(--rad2);color:var(--accent);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:10px;font-family:inherit}
.cost-pull-btn:hover{background:linear-gradient(135deg,rgba(45,212,191,0.25),rgba(139,92,246,0.25))}

/* Group title row */
.cs-group-title-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding-left:2px}
.cs-group-title{font-size:13px;font-weight:600;color:var(--txt2);flex:1;cursor:pointer;padding:2px 4px;border-radius:4px}
body.edit-mode .cs-group-title:hover{background:var(--glass);outline:1px solid var(--accent)}
.cs-del-group{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--danger);border-radius:6px;padding:2px 6px;font-size:11px;cursor:pointer}
.cs-del-group:hover{background:var(--danger);color:#fff}

/* Cost row: drag handle + del */
.cs-row{position:relative;gap:8px}
.cs-drag-handle{color:var(--txt3);cursor:grab;user-select:none;line-height:1;font-size:12px;flex-shrink:0}
.cs-row.dragging{opacity:0.4}
.cs-row.drag-over{outline:2px solid var(--accent)}
.cs-group.drag-over{outline:2px dashed var(--accent);outline-offset:2px;border-radius:var(--rad2)}

.cs-del-row{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--danger);border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer;flex-shrink:0;line-height:1;padding:0}
.cs-del-row:hover{background:var(--danger);color:#fff}

.cs-curr-picker{background:var(--bg);border:1px solid var(--glass2);border-radius:6px;color:var(--txt2);font-size:10px;padding:2px 4px;font-family:inherit;cursor:pointer}

/* Editable cost text */
.cl{flex:1;cursor:default}
.cl-label{cursor:pointer;padding:2px 4px;border-radius:4px;display:inline-block}
body.edit-mode .cl-label:hover{background:var(--glass);outline:1px solid var(--accent)}
.csub{cursor:default;display:block;font-size:11px;color:var(--txt3);margin-top:2px;padding:1px 4px;border-radius:3px}
body.edit-mode .csub{cursor:pointer}
body.edit-mode .csub:hover{background:var(--glass);outline:1px solid var(--accent)}
.csub-empty{font-style:italic;opacity:0.6}
.csub-inline{font-size:10px;color:var(--txt3);font-weight:400;margin-left:2px}
.cost-edit-input{width:100%;background:var(--bg);border:1px solid var(--accent);border-radius:4px;color:var(--txt);font-size:inherit;font-family:inherit;padding:2px 6px}

/* Cost row layout for edit mode */
body.edit-mode .cs-row{padding-left:8px;padding-right:8px}

/* Add buttons */
.cs-add-row-btn{width:100%;background:var(--glass);border:1px dashed var(--glass3);border-radius:var(--rad3);color:var(--txt2);padding:8px;font-size:11px;cursor:pointer;font-family:inherit;margin-top:4px}
.cs-add-row-btn:hover{background:var(--glass2);color:var(--accent);border-color:var(--accent)}
.cs-add-group-btn{width:100%;background:linear-gradient(135deg,rgba(45,212,191,0.08),rgba(139,92,246,0.08));border:1px dashed var(--accent);border-radius:var(--rad2);color:var(--accent);padding:12px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:6px}
.cs-add-group-btn:hover{background:linear-gradient(135deg,rgba(45,212,191,0.18),rgba(139,92,246,0.18))}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn 0.2s ease}
.modal-box{background:var(--bg2);border-radius:16px;width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;animation:slideUp 0.3s cubic-bezier(0.2,0.8,0.2,1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--glass);font-size:15px;font-weight:600}
.modal-close{background:none;border:none;color:var(--txt2);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.modal-close:hover{background:var(--glass)}
.modal-body{padding:14px 16px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 16px;border-top:1px solid var(--glass);display:flex;gap:8px;justify-content:flex-end}
.modal-btn{padding:8px 16px;border-radius:8px;background:var(--glass);color:var(--txt);border:1px solid var(--glass2);cursor:pointer;font-size:13px;font-family:inherit}
.modal-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0e1a;border:none;font-weight:600}
.modal-btn:hover{filter:brightness(1.1)}

.mp-hint{font-size:11px;color:var(--txt3);margin-bottom:10px;padding:8px;background:var(--glass);border-radius:6px}

.mp-row:hover{background:var(--glass2)}

.mp-name{flex:1;min-width:0;font-size:12px}
.mp-name>div:first-child{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-amt{color:var(--accent);font-size:11px;margin-top:2px;font-weight:500}

.mp-empty{text-align:center;color:var(--txt3);font-size:12px;padding:24px}

.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--txt3);margin-left:6px}
.sync-badge.syncing{color:var(--warn)}
.sync-badge.ok{color:var(--ok)}
.sync-badge.err{color:var(--danger)}
.auth-badge{display:inline-flex;align-items:center;font-size:10px;padding:3px 8px;border-radius:10px;background:transparent;border:1px solid transparent;cursor:pointer;font-family:inherit;margin-left:6px;transition:all 0.15s}
.auth-badge.authed{color:var(--ok);border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.08)}
.auth-badge.unauthed{color:var(--warn);border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.08)}
.auth-badge:hover{filter:brightness(1.2)}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.nz-clock{font-size:17px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:0.5px;line-height:1;background:var(--glass);padding:5px 10px;border-radius:999px;border:1px solid var(--glass2);display:inline-flex;align-items:center;gap:5px}
.nz-clock .flag{font-size:14px}
.nz-clock.tick{animation:clockPulse 0.15s ease}
@keyframes clockPulse{0%{opacity:0.7}100%{opacity:1}}

/* EDIT MODE banner */
.edit-banner{display:none;background:var(--warn);color:#0a0e1a;padding:6px 14px;font-size:11px;font-weight:500;text-align:center}
.edit-mode .edit-banner{display:block}

/* TOAST */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--bg3);color:var(--txt);padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:300;opacity:0;pointer-events:none;transition:opacity 0.3s,transform 0.3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

// ─── PROGRESS BAR ──────────────────────────────────────────────────────────
function updateProgress(){
  var done=0,total=0;
  for(var i=0;i<BOOKING_DATA.length;i++){
    var sec=BOOKING_DATA[i];
    for(var j=0;j<sec.items.length;j++){
      total++;
      var id=sec.items[j].id;
      if(state.todoStates[id]||sec.items[j].done) done++;
    }
  }
  var pct = total>0?(done/total*100):0;
  var fill=$id('progress-fill'); if(fill)fill.style.width=pct+'%';
  var bp=$id('book-progress'); if(bp)bp.textContent=done+'/'+total;
}

// ─── RENDER DAY TABS ───────────────────────────────────────────────────────
function renderTabs(){
  var c=$id('day-tabs'); if(!c)return;
  c.innerHTML='';
  var wd={'一':'MON','二':'TUE','三':'WED','四':'THU','五':'FRI','六':'SAT','日':'SUN'};
  for(var i=0;i<TRIP_DATA.length;i++){
    var d=TRIP_DATA[i];
    var parts=(d.date||'').split(' ');
    var dt=parts[0]||'';
    var w=parts[1]||'';
    var icon=(d.title||'').match(/^(\p{Emoji}+)/u);
    var iconChar=icon?icon[1]:'';
    var btn=document.createElement('button');
    btn.className='day-tab'+(i===state.curDay?' active':'');
    btn.setAttribute('data-day',i);
    btn.draggable=false;  // enabled in edit mode
    btn.innerHTML=
      (iconChar?'<span class="dt-icon">'+escHtml(iconChar)+'</span>':'')+
      '<span class="dt-d">'+escHtml(dt)+'</span>'+
      '<span class="dt-wd">'+escHtml(wd[w]||w)+'</span>';
    c.appendChild(btn);
  }
}

// ─── RENDER DAY PANEL ──────────────────────────────────────────────────────
function renderPanel(idx){
  var d=TRIP_DATA[idx]; if(!d)return;
  var c=$id('panels-container'); if(!c)return;
  c.innerHTML='';

  var panel=document.createElement('section');
  panel.className='day-panel active';
  panel.id='day-panel';
  panel.setAttribute('data-day',idx);

  // Header
  var hdr=document.createElement('div');
  hdr.className='dp-header';
  hdr.innerHTML='<div class="dp-title">'+escHtml(d.title||'')+'</div>'+
                '<div class="dp-sub">'+escHtml(d.date||'')+' · 第 '+(idx+1)+' 天 / 共 '+TRIP_DATA.length+' 天</div>';
  panel.appendChild(hdr);

  // Toggle: 行程 / 地圖
  var tg=document.createElement('div');
  tg.className='dp-toggle';
  tg.innerHTML='<button class="dp-btn '+(state.curView==='itin'?'active':'')+'" data-view="itin">📋 行程</button>'+
               '<button class="dp-btn '+(state.curView==='map'?'active':'')+'" data-view="map">🗺 地圖</button>';
  panel.appendChild(tg);

  // ITINERARY
  var itin=document.createElement('div');
  itin.className='dp-itin'+(state.curView==='map'?' hidden':'');
  itin.id='dp-itin';

  // Render items with add-between
  if(state.editMode){
    itin.appendChild(makeAddBetween(idx,0));
  }
  for(var i=0;i<d.items.length;i++){
    itin.appendChild(makeCard(d.items[i],idx,i));
    if(state.editMode){
      itin.appendChild(makeAddBetween(idx,i+1));
    }
  }
  // Hotel card
  if(d.hotel && (d.hotel.name||d.hotel.icon)){
    itin.appendChild(makeHotelCard(d.hotel,idx));
  }
  panel.appendChild(itin);

  // MAP container
  var map=document.createElement('div');
  map.className='dp-map'+(state.curView==='map'?' active':'');
  map.id='dp-map';
  map.innerHTML='<div class="dp-map-inner" id="map-inner"></div>';
  panel.appendChild(map);

  c.appendChild(panel);

  if(state.curView==='map'){
    setTimeout(function(){renderMap(idx);},50);
  }
}

function makeCard(item,dayIdx,itemIdx){
  var card=document.createElement('div');
  card.className='card';
  card.draggable=false;
  card.setAttribute('data-day',dayIdx);
  card.setAttribute('data-item',itemIdx);

  // Drag handle
  var dh=document.createElement('span');
  dh.className='card-drag-handle';
  dh.textContent='⋮⋮';
  card.appendChild(dh);

  // Delete button
  var del=document.createElement('button');
  del.className='card-del';
  del.innerHTML='✕';
  del.setAttribute('data-act','del-item');
  card.appendChild(del);

  // Content
  var ct=document.createElement('div');
  ct.className='ct';
  ct.innerHTML=
    '<span class="c-time" data-field="time" data-day="'+dayIdx+'" data-item="'+itemIdx+'">'+escHtml(item.time||'')+'</span>'+
    '<span class="c-icon" data-field="icon" data-day="'+dayIdx+'" data-item="'+itemIdx+'">'+escHtml(item.icon||'')+'</span>'+
    '<span class="c-name" data-field="name" data-day="'+dayIdx+'" data-item="'+itemIdx+'">'+escHtml(item.name||'')+'</span>';
  card.appendChild(ct);

  if(item.desc){
    var desc=document.createElement('div');
    desc.className='c-desc';
    desc.setAttribute('data-field','desc');
    desc.setAttribute('data-day',dayIdx);
    desc.setAttribute('data-item',itemIdx);
    if(/<[a-z!/]/i.test(item.desc||'')){desc.innerHTML=item.desc;desc.removeAttribute('data-field');}else{desc.textContent=item.desc;}
    card.appendChild(desc);
  } else if(state.editMode){
    var desc=document.createElement('div');
    desc.className='c-desc';
    desc.setAttribute('data-field','desc');
    desc.setAttribute('data-day',dayIdx);
    desc.setAttribute('data-item',itemIdx);
    desc.style.color='var(--txt3)';
    desc.style.fontStyle='italic';
    desc.textContent='(點擊新增說明)';
    card.appendChild(desc);
  }

  // Tags (urgency / status badges from v1)
  if(item.tags && item.tags.length){
    var tags=document.createElement('div');
    tags.className='c-tags';
    for(var ti=0;ti<item.tags.length;ti++){
      var t=item.tags[ti];
      var span=document.createElement('span');
      span.className='c-tag';
      // Color hints based on tag content
      if(/🔴|立即|urgent/i.test(t)){span.classList.add('book');span.style.color='var(--danger)';span.style.borderColor='rgba(248,113,113,0.35)';}
      else if(/⚡|前訂|需預約|book/i.test(t)){span.classList.add('book');}
      else if(/✓|✅|已訂|done/i.test(t)){span.classList.add('done');}
      span.textContent=t;
      tags.appendChild(span);
    }
    card.appendChild(tags);
  }

  // Links (官網 / 訂位 / etc.)
  if(item.links && item.links.length){
    var linksWrap=document.createElement('div');
    linksWrap.className='c-tags';
    linksWrap.style.marginTop='4px';
    for(var li=0;li<item.links.length;li++){
      var l=item.links[li];
      var a=document.createElement('a');
      a.className='c-tag';
      a.style.color='var(--accent)';
      a.style.borderColor='rgba(45,212,191,0.3)';
      a.style.cursor='pointer';
      a.href=l.url;
      a.target='_blank';
      a.rel='noopener';
      a.textContent='🔗 '+l.text;
      linksWrap.appendChild(a);
    }
    card.appendChild(linksWrap);
  }

  return card;
}

function makeHotelCard(h,dayIdx){
  var card=document.createElement('div');
  card.className='card card-hotel';
  card.setAttribute('data-day',dayIdx);
  card.setAttribute('data-hotel','1');

  var grid=document.createElement('div');
  grid.className='hotel-grid';
  grid.innerHTML=
    '<span class="h-icon" data-field="hicon" data-day="'+dayIdx+'">'+escHtml(h.icon||'🏨')+'</span>'+
    '<div>'+
      '<div class="h-name" data-field="hname" data-day="'+dayIdx+'">'+escHtml(h.name||'')+'</div>'+
      (h.desc?'<div class="h-desc" data-field="hdesc" data-day="'+dayIdx+'">'+escHtml(h.desc)+'</div>':
       (state.editMode?'<div class="h-desc" data-field="hdesc" data-day="'+dayIdx+'" style="color:var(--txt3);font-style:italic">(點擊新增說明)</div>':''))+
    '</div>'+
    '<div class="h-price" data-field="hprice" data-day="'+dayIdx+'">'+escHtml(h.price||'')+'</div>';
  card.appendChild(grid);
  return card;
}

function makeAddBetween(dayIdx,insertAt){
  var div=document.createElement('div');
  div.className='card-add-between';
  div.setAttribute('data-act','add-between');
  div.setAttribute('data-day',dayIdx);
  div.setAttribute('data-at',insertAt);
  div.textContent='＋ 在此插入新項目';
  return div;
}

function switchDay(idx){
  if(idx<0||idx>=TRIP_DATA.length)return;
  state.curDay=idx;
  $qa('.day-tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});
  renderPanel(idx);
  // scroll active tab into view
  var active=$q('.day-tab.active');
  if(active && active.scrollIntoView){active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}
}

        '<option value="restaurant">🍽️ 餐廳</option>'+
      '</select>'+
      '<input type="text" id="new-todo-text" placeholder="新增待辦事項...">'+

function handleAddTodo(){
  var inp=$id('new-todo-text'); if(!inp)return;
  var text=inp.value.trim(); if(!text)return;
  var sel=$id('new-todo-cat');
  var cat=sel?sel.value:'auto';

  if(cat==='auto') cat=guessCategory(text);

  // Find target section
  var target=null;
  for(var i=0;i<BOOKING_DATA.length;i++){
    if(BOOKING_DATA[i].cat===cat){target=BOOKING_DATA[i];break;}
  }
  if(!target) target=BOOKING_DATA[BOOKING_DATA.length-1];
  var newId='t'+Date.now();
  target.items.push({id:newId,text:text,done:false});
  state.bookDirty=true;
  inp.value='';
  renderBooking();
  toast('已新增到「'+target.section+'」');
  syncBooking();
}

function guessCategory(text){
  var t=text.toLowerCase();
  var rules=[
    ['hotel',/住宿|酒店|hotel|airbnb|民宿|villa|resort|hostel|入住|check\s*in/i],
    ['transport',/機票|航班|轉機|租車|租機車|包車|計程車|uber|taxi|火車|高鐵|地鐵|公車|巴士|渡輪|船|ferry|flight|train|bus/i],
    ['restaurant',/訂位|預約|reservation|餐廳|restaurant/i],
    ['food',/吃|喝|早餐|午餐|晚餐|宵夜|甜點|小吃|brunch|breakfast|lunch|dinner|café|coffee|tea/i],
    ['activity',/票|門票|預訂|booking|ticket|tour|體驗|spa|按摩|massage|gondola|cable|cruise|表演|show|博物館|museum/i],
  ];
  for(var i=0;i<rules.length;i++){
    if(rules[i][1].test(t))return rules[i][0];
  }
  return 'activity';
}

// ─── COST ──────────────────────────────────────────────────────────────────
// FX conversion: returns TWD amount given (amount, currency)
function toTWD(amount, currency){
  if(!currency || currency==='TWD') return amount;
  if(currency==='NZD') return Math.round(amount * state.fxRate);
  return amount;
}
function fmtMoney(twdAmount){
  return 'TWD $' + Math.round(twdAmount).toLocaleString();
}
function fmtMoneyWithCurr(amount, currency){
  // Display "NZD $123 (≈ TWD $2,400)" if currency is not TWD; else just "TWD $X"
  if(!currency || currency==='TWD'){
    return 'TWD $' + amount.toLocaleString();
  }
  var twd = toTWD(amount, currency);
  return currency + ' $' + amount.toLocaleString() + ' <span class="csub-inline">≈ ' + fmtMoney(twd) + '</span>';
}
// rowActualTWD: returns the TWD value of a row using actual if set, else budget
function rowActualTWD(row){
  if(row.subtotal) return 0;
  var amt = (state.costActuals[row.id]!=null) ? state.costActuals[row.id] : (row.budget||0);
  return toTWD(amt, row.currency||'TWD');
}

function renderCost(){
  var c=$id('cost-list');if(!c)return;
  c.innerHTML='';

  // ── FX setting row ──
  var fxRow=document.createElement('div');
  fxRow.className='cost-fx';
  fxRow.innerHTML=
    '<span class="fx-label">💱 匯率</span>'+
    '<span class="fx-pair">1 NZD =</span>'+
    '<input type="number" id="fx-input" step="0.1" min="0" value="'+state.fxRate+'" style="width:60px">'+
    '<span class="fx-pair">TWD</span>'+
    '<span class="fx-hint" id="fx-hint"></span>';
  c.appendChild(fxRow);

  // ── Hint ──
  var hint=document.createElement('div');
  hint.className='cost-hint';
  hint.innerHTML=state.editMode ?
    '✏️ 編輯模式：拖曳項目重排/搬家 · ✕ 刪除 · ＋ 新增 · 雙擊任意文字編輯' :
    '💡 雙擊金額可輸入實際花費 · 點右下「✏️ 編輯」進入完整編輯模式';
  c.appendChild(hint);

  // ── Live summary (will be recalculated after FX changes) ──
  var budget=0, actual=0;
  for(var i=0;i<COST_GROUPS.length;i++){
    var g=COST_GROUPS[i];
    for(var j=0;j<g.rows.length;j++){
      var r=g.rows[j];
      if(r.subtotal)continue;
      var bTWD = toTWD(r.budget||0, r.currency||'TWD');
      budget += bTWD;
      if(state.costActuals[r.id]!=null){
        actual += toTWD(state.costActuals[r.id], r.currency||'TWD');
      }
    }
  }
  var summ=document.createElement('div');
  summ.className='cs-summary';
  summ.innerHTML=
    '<div class="cs-summary-card"><div class="label">預算合計</div><div class="value">'+fmtMoney(budget)+'</div></div>'+
    '<div class="cs-summary-card"><div class="label">已知實際</div><div class="value" style="color:var(--ok)">'+fmtMoney(actual)+'</div></div>';
  c.appendChild(summ);

  // ── D feature: "Pull amounts from itinerary" button (edit mode only) ──
  if(state.editMode){
    var pullBtn=document.createElement('button');
    pullBtn.className='cost-pull-btn';
    pullBtn.id='cost-pull-btn';
    pullBtn.innerHTML='🪄 從行程吸取金額';
    pullBtn.title='掃描行程，找出含金額但尚未列在費用裡的項目';
    c.appendChild(pullBtn);
  }

  // ── Groups ──
  for(var gi=0;gi<COST_GROUPS.length;gi++){
    var g=COST_GROUPS[gi];
    var div=document.createElement('div');
    div.className='cs-group';
    div.setAttribute('data-gid',g.id);
    div.setAttribute('data-gidx',gi);

    var titleRow=document.createElement('div');
    titleRow.className='cs-group-title-row';
    var title=document.createElement('span');
    title.className='cs-group-title';
    title.setAttribute('data-field','group-title');
    title.setAttribute('data-gidx',gi);
    title.textContent=g.title;
    titleRow.appendChild(title);
    if(state.editMode){
      var delGroup=document.createElement('button');
      delGroup.className='cs-del-group';
      delGroup.setAttribute('data-act','del-group');
      delGroup.setAttribute('data-gidx',gi);
      delGroup.title='刪除整組';
      delGroup.innerHTML='🗑';
      titleRow.appendChild(delGroup);
    }
    div.appendChild(titleRow);

    for(var ri=0;ri<g.rows.length;ri++){
      var r=g.rows[ri];
      if(r.subtotal){
        // recalculate live subtotal in TWD
        var subSum=0;
        for(var k=0;k<g.rows.length;k++){
          if(g.rows[k].subtotal)continue;
          subSum += rowActualTWD(g.rows[k]);
        }
        var sr=document.createElement('div');
        sr.className='cs-sub';
        sr.innerHTML='<span>'+escHtml(r.label)+'</span><span class="am">'+fmtMoney(subSum)+'</span>';
        div.appendChild(sr);
      } else {
        var rr=document.createElement('div');
        rr.className='cs-row';
        rr.setAttribute('data-gidx',gi);
        rr.setAttribute('data-ridx',ri);
        rr.setAttribute('data-rid',r.id);
        rr.draggable=false;

        var hasActual=state.costActuals[r.id]!=null;
        var displayAmt=hasActual ? state.costActuals[r.id] : (r.budget||0);
        var curr=r.currency||'TWD';

        var dh='';
        if(state.editMode){
          dh='<span class="cs-drag-handle">⋮⋮</span>';
        }
        var delBtn='';
        if(state.editMode){
          delBtn='<button class="cs-del-row" data-act="del-row" data-gidx="'+gi+'" data-ridx="'+ri+'">✕</button>';
        }
        // Currency picker (edit-mode only)
        var currPicker='';
        if(state.editMode){
          currPicker='<select class="cs-curr-picker" data-act="curr" data-gidx="'+gi+'" data-ridx="'+ri+'">'+
            '<option value="TWD"'+(curr==='TWD'?' selected':'')+'>TWD</option>'+
            '<option value="NZD"'+(curr==='NZD'?' selected':'')+'>NZD</option>'+
          '</select>';
        }

        rr.innerHTML=
          dh+
          '<div class="cl">'+
            '<span class="cl-label" data-field="label" data-gidx="'+gi+'" data-ridx="'+ri+'">'+escHtml(r.label)+'</span>'+
            (r.sub?'<span class="csub" data-field="sub" data-gidx="'+gi+'" data-ridx="'+ri+'">'+escHtml(r.sub)+'</span>'
                  : (state.editMode?'<span class="csub csub-empty" data-field="sub" data-gidx="'+gi+'" data-ridx="'+ri+'">(點擊新增說明)</span>':''))+
          '</div>'+
          currPicker+
          '<span class="am editable'+(hasActual?' has-actual':'')+'" data-key="'+escHtml(r.id)+'" data-gidx="'+gi+'" data-ridx="'+ri+'">'+
            fmtMoneyWithCurr(displayAmt, curr)+
          '</span>'+
          delBtn;
        div.appendChild(rr);
      }
    }

    // ＋ add row (edit mode)
    if(state.editMode){
      var addBtn=document.createElement('button');
      addBtn.className='cs-add-row-btn';
      addBtn.setAttribute('data-act','add-row');
      addBtn.setAttribute('data-gidx',gi);
      addBtn.textContent='＋ 新增項目';
      div.appendChild(addBtn);
    }

    c.appendChild(div);
  }

  // ＋ add group (edit mode)
  if(state.editMode){
    var addGroupBtn=document.createElement('button');
    addGroupBtn.className='cs-add-group-btn';
    addGroupBtn.setAttribute('data-act','add-group');
    addGroupBtn.textContent='＋ 新增分組';
    c.appendChild(addGroupBtn);
  }

  // ── Grand total ──
  var grand=document.createElement('div');
  grand.className='cs-grand';
  grand.innerHTML='<span>2人合計（預算）</span><span class="am">'+fmtMoney(budget)+'</span>';
  c.appendChild(grand);

  // ── Bind FX input ──
  var fxInp=$id('fx-input');
  if(fxInp){
    fxInp.addEventListener('change',function(){
      var v=parseFloat(fxInp.value);
      if(isNaN(v)||v<=0){fxInp.value=state.fxRate;return;}
      state.fxRate=v;
      syncFX();
      renderCost();
      toast('匯率已更新');
    });
  }
  // Bind D button
  var pullEl=$id('cost-pull-btn');
  if(pullEl){
    pullEl.addEventListener('click',openCostPullModal);
  }
}

function startCostEdit(span){
  if(span.classList.contains('editing'))return;
  var key=span.getAttribute('data-key');
  var gidx=parseInt(span.getAttribute('data-gidx'),10);
  var ridx=parseInt(span.getAttribute('data-ridx'),10);
  var row=COST_GROUPS[gidx] && COST_GROUPS[gidx].rows[ridx];
  if(!row)return;
  var curr=row.currency||'TWD';
  var current=state.costActuals[key]!=null ? state.costActuals[key] : (row.budget||0);
  span.classList.add('editing');
  var orig=span.innerHTML;
  span.innerHTML='';
  var inp=document.createElement('input');
  inp.type='number';
  inp.value=current;
  inp.style.cssText='width:90px;background:transparent;border:none;color:inherit;font-size:inherit;font-weight:inherit;text-align:right;font-variant-numeric:tabular-nums';
  var prefix=document.createElement('span');
  prefix.textContent=curr+' $';
  prefix.style.cssText='color:inherit;margin-right:2px';
  span.appendChild(prefix);
  span.appendChild(inp);
  inp.focus();
  inp.select();
  var done=false;
  function commit(){
    if(done)return; done=true;
    var v=parseInt(inp.value,10);
    span.classList.remove('editing');
    if(isNaN(v)){span.innerHTML=orig;return;}
    state.costActuals[key]=v;
    syncCosts();
    renderCost();
    toast('已記錄實際花費');
  }
  function cancel(){
    if(done)return; done=true;
    span.classList.remove('editing');
    span.innerHTML=orig;
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();commit();}
    else if(e.key==='Escape'){e.preventDefault();cancel();inp.blur();}
  });
}

// ─── E: edit cost label/sub (inline text editing) ──────────────────────────
function startCostTextEdit(el){
  if(el.classList.contains('editing'))return;
  var field=el.getAttribute('data-field');  // 'label' | 'sub' | 'group-title'
  var gidx=parseInt(el.getAttribute('data-gidx'),10);
  var ridx=el.hasAttribute('data-ridx')?parseInt(el.getAttribute('data-ridx'),10):null;
  var orig=el.textContent;
  if(el.classList.contains('csub-empty'))orig='';
  el.classList.add('editing');
  var w=document.createElement('input');
  w.className='cost-edit-input';
  w.value=orig;
  el.innerHTML='';
  el.appendChild(w);
  w.focus();
  w.select();
  var done=false;
  function commit(){
    if(done)return; done=true;
    var v=w.value.trim();
    el.classList.remove('editing','csub-empty');
    if(field==='group-title'){
      if(COST_GROUPS[gidx]){COST_GROUPS[gidx].title = v || COST_GROUPS[gidx].title;}
    } else if(COST_GROUPS[gidx] && COST_GROUPS[gidx].rows[ridx]){
      COST_GROUPS[gidx].rows[ridx][field] = v;
    }
    state.costDirty=true;
    syncCostGroups();
    renderCost();
  }
  function cancel(){
    if(done)return; done=true;
    el.classList.remove('editing');
    el.textContent=orig;
  }
  w.addEventListener('blur',commit);
  w.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();commit();}
    else if(e.key==='Escape'){e.preventDefault();cancel();w.blur();}
  });
}

// ─── A: add/del row/group, currency change ─────────────────────────────────
function nextCostId(){
  var max=0;
  for(var i=0;i<COST_GROUPS.length;i++){
    for(var j=0;j<COST_GROUPS[i].rows.length;j++){
      var id=COST_GROUPS[i].rows[j].id||'';
      var m=id.match(/^c(\d+)$/);
      if(m){var n=parseInt(m[1],10);if(n>max)max=n;}
    }
  }
  return 'c'+(max+1);
}

function addCostRow(gidx){
  if(!COST_GROUPS[gidx])return;
  var name=prompt('項目名稱（例：纜車票）');
  if(!name)return;
  var sub=prompt('子說明（可空，例：NZD $80/人）','')||'';
  var bs=prompt('預算金額（純數字）','0');
  var b=parseInt(bs,10); if(isNaN(b))b=0;
  var curr=(prompt('幣別 TWD 或 NZD','TWD')||'TWD').toUpperCase();
  if(curr!=='TWD'&&curr!=='NZD')curr='TWD';
  // Insert before first subtotal row, else at end
  var insertAt=COST_GROUPS[gidx].rows.length;
  for(var i=0;i<COST_GROUPS[gidx].rows.length;i++){
    if(COST_GROUPS[gidx].rows[i].subtotal){insertAt=i;break;}
  }
  var newRow={id:nextCostId(),label:name,sub:sub,budget:b,currency:curr,display:''};
  COST_GROUPS[gidx].rows.splice(insertAt,0,newRow);
  state.costDirty=true;
  syncCostGroups();
  renderCost();
  toast('已新增項目');
}

function delCostRow(gidx,ridx){
  if(!COST_GROUPS[gidx]||!COST_GROUPS[gidx].rows[ridx])return;
  var row=COST_GROUPS[gidx].rows[ridx];
  if(!confirm('確定刪除「'+row.label+'」？'))return;
  if(state.costActuals[row.id]!=null)delete state.costActuals[row.id];
  COST_GROUPS[gidx].rows.splice(ridx,1);
  state.costDirty=true;
  syncCostGroups();
  syncCosts();
  renderCost();
}

function addCostGroup(){
  var name=prompt('分組名稱（含 emoji，例：🎁 紀念品）');
  if(!name)return;
  COST_GROUPS.push({id:'g'+Date.now(), title:name, rows:[]});
  state.costDirty=true;
  syncCostGroups();
  renderCost();
}

function delCostGroup(gidx){
  if(!COST_GROUPS[gidx])return;
  if(!confirm('刪除整組「'+COST_GROUPS[gidx].title+'」？所有項目都會一併刪除'))return;
  // Clean actuals for rows in this group
  COST_GROUPS[gidx].rows.forEach(function(r){
    if(r.id && state.costActuals[r.id]!=null)delete state.costActuals[r.id];
  });
  COST_GROUPS.splice(gidx,1);
  state.costDirty=true;
  syncCostGroups();
  syncCosts();
  renderCost();
}

function setRowCurrency(gidx,ridx,curr){
  if(!COST_GROUPS[gidx]||!COST_GROUPS[gidx].rows[ridx])return;
  COST_GROUPS[gidx].rows[ridx].currency=curr;
  state.costDirty=true;
  syncCostGroups();
  renderCost();
}

// ─── B: cost row drag-and-drop (within/across groups) ──────────────────────
function bindCostDragHandlers(){
  var list=$id('cost-list');
  if(!list)return;
  list.addEventListener('dragstart',function(e){
    if(!state.editMode)return;
    var row=e.target.closest('.cs-row');
    if(!row)return;
    state.costDragSrc={
      gidx: parseInt(row.getAttribute('data-gidx'),10),
      ridx: parseInt(row.getAttribute('data-ridx'),10)
    };
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',row.getAttribute('data-rid'));}catch(_e){}
  });
  list.addEventListener('dragover',function(e){
    if(!state.editMode||!state.costDragSrc)return;
    e.preventDefault();
    // Highlight target group
    var grp=e.target.closest('.cs-group');
    $qa('.cs-group.drag-over').forEach(function(g){g.classList.remove('drag-over');});
    $qa('.cs-row.drag-over').forEach(function(r){r.classList.remove('drag-over');});
    if(grp)grp.classList.add('drag-over');
    var tRow=e.target.closest('.cs-row');
    if(tRow)tRow.classList.add('drag-over');
  });
  list.addEventListener('drop',function(e){
    if(!state.editMode||!state.costDragSrc)return;
    e.preventDefault();
    var src=state.costDragSrc;
    var tRow=e.target.closest('.cs-row');
    var tGrp=e.target.closest('.cs-group');
    if(!tGrp){cleanupCostDrag();return;}
    var tGidx=parseInt(tGrp.getAttribute('data-gidx'),10);
    if(isNaN(tGidx)){cleanupCostDrag();return;}

    // Move row
    var srcRow=COST_GROUPS[src.gidx].rows.splice(src.ridx,1)[0];
    if(!srcRow){cleanupCostDrag();return;}

    if(tRow){
      var tRidx=parseInt(tRow.getAttribute('data-ridx'),10);
      // If dropping into same group, adjust target idx for the removal
      if(src.gidx===tGidx && tRidx>src.ridx)tRidx--;
      COST_GROUPS[tGidx].rows.splice(tRidx,0,srcRow);
    } else {
      // Dropped on group area, not specific row: insert before first subtotal
      var insertAt=COST_GROUPS[tGidx].rows.length;
      for(var i=0;i<COST_GROUPS[tGidx].rows.length;i++){
        if(COST_GROUPS[tGidx].rows[i].subtotal){insertAt=i;break;}
      }
      COST_GROUPS[tGidx].rows.splice(insertAt,0,srcRow);
    }
    state.costDirty=true;
    syncCostGroups();
    renderCost();
    if(src.gidx!==tGidx)toast('已搬到「'+COST_GROUPS[tGidx].title+'」');
    cleanupCostDrag();
  });
  list.addEventListener('dragend',cleanupCostDrag);
}
function cleanupCostDrag(){
  $qa('.cs-row.dragging,.cs-row.drag-over,.cs-group.drag-over').forEach(function(el){
    el.classList.remove('dragging','drag-over');
  });
  $qa('.cs-row[draggable="true"]').forEach(function(r){r.draggable=false;});
  state.costDragSrc=null;
}

// ─── D: pull amounts from itinerary ───────────────────────────────────────
function scanItineraryAmounts(){
  // Find all items in TRIP_DATA with money mentions in name/desc
  var found=[];
  var moneyRe=/(?:NZD|TWD|nt\$|\$)\s*([\d,]+(?:\.\d+)?)/gi;
  for(var di=0;di<TRIP_DATA.length;di++){
    var d=TRIP_DATA[di];
    for(var ii=0;ii<d.items.length;ii++){
      var it=d.items[ii];
      var text=(it.name||'')+' '+(it.desc||'');
      moneyRe.lastIndex=0;
      var matches=[];
      var m;
      while((m=moneyRe.exec(text))!==null){
        // Detect currency from preceding token
        var pre=text.substring(Math.max(0,m.index-5),m.index).toUpperCase();
        var currency = pre.indexOf('NZD')>=0 ? 'NZD' : (pre.indexOf('TWD')>=0||pre.indexOf('NT')>=0?'TWD':'TWD');
        var amt=parseInt(m[1].replace(/,/g,''),10);
        if(isNaN(amt)||amt<=0)continue;
        matches.push({amount:amt,currency:currency,raw:m[0]});
      }
      if(matches.length>0){
        found.push({
          dayIdx:di, itemIdx:ii,
          date:d.date, name:it.name,
          matches:matches
        });
      }
    }
  }
  return found;
}

function existsInCost(name){
  for(var i=0;i<COST_GROUPS.length;i++){
    for(var j=0;j<COST_GROUPS[i].rows.length;j++){
      var r=COST_GROUPS[i].rows[j];
      if(r.subtotal)continue;
      // Match if label contains a substring of name (first 6 chars), case-insensitive
      var n=(name||'').slice(0,10).toLowerCase();
      var l=(r.label||'').toLowerCase();
      if(n && l && (l.indexOf(n)>=0 || n.indexOf(l.slice(0,6))>=0))return true;
    }
  }
  return false;
}

function openCostPullModal(){
  var found=scanItineraryAmounts();
  var candidates=found.filter(function(f){return !existsInCost(f.name);});
  if(candidates.length===0){
    toast('沒找到尚未列入費用的金額項目');
    return;
  }
  // Build modal
  var overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='cost-pull-modal';
  var box=document.createElement('div');
  box.className='modal-box';
  var groupOpts='';
  for(var gi=0;gi<COST_GROUPS.length;gi++){
    groupOpts+='<option value="'+gi+'">'+escHtml(COST_GROUPS[gi].title)+'</option>';
  }
  var rowsHtml='';
  for(var ci=0;ci<candidates.length;ci++){
    var c=candidates[ci];
    // Pick the most informative match (largest amount)
    var best=c.matches[0];
    for(var k=1;k<c.matches.length;k++){if(c.matches[k].amount>best.amount)best=c.matches[k];}
    rowsHtml +=
      '<label class="mp-row">'+
        '<input type="checkbox" data-i="'+ci+'" checked>'+
        '<div class="mp-name">'+
          '<div>'+escHtml(c.date)+' · '+escHtml(c.name)+'</div>'+
          '<div class="mp-amt">'+best.currency+' $'+best.amount.toLocaleString()+'</div>'+
        '</div>'+
        '<select data-g="'+ci+'">'+groupOpts+'</select>'+
      '</label>';
  }
  box.innerHTML=
    '<div class="modal-header">🪄 從行程吸取金額'+
      '<button class="modal-close" id="mp-cancel">✕</button>'+
    '</div>'+
    '<div class="modal-body">'+
      '<div class="mp-hint">勾選想加入費用的項目，並選擇分組</div>'+
      rowsHtml+
      (candidates.length===0?'<div class="mp-empty">沒有需要加入的項目</div>':'')+
    '</div>'+
    '<div class="modal-footer">'+
      '<button class="modal-btn" id="mp-cancel-btn">取消</button>'+
      '<button class="modal-btn primary" id="mp-confirm">加入選取的項目</button>'+
    '</div>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  function closeModal(){
    var ov=$id('cost-pull-modal');
    if(ov && ov.parentNode)ov.parentNode.removeChild(ov);
  }
  $id('mp-cancel').addEventListener('click',closeModal);
  $id('mp-cancel-btn').addEventListener('click',closeModal);
  overlay.addEventListener('click',function(e){if(e.target===overlay)closeModal();});

  $id('mp-confirm').addEventListener('click',function(){
    var added=0;
    $qa('input[data-i]', box).forEach(function(cb){
      if(!cb.checked)return;
      var i=parseInt(cb.getAttribute('data-i'),10);
      var c=candidates[i];
      var grpSel=box.querySelector('select[data-g="'+i+'"]');
      var gidx=parseInt(grpSel.value,10);
      // Use the largest match's amount as budget
      var best=c.matches[0];
      for(var k=1;k<c.matches.length;k++){if(c.matches[k].amount>best.amount)best=c.matches[k];}
      // Insert before first subtotal
      var insertAt=COST_GROUPS[gidx].rows.length;
      for(var k2=0;k2<COST_GROUPS[gidx].rows.length;k2++){
        if(COST_GROUPS[gidx].rows[k2].subtotal){insertAt=k2;break;}
      }
      COST_GROUPS[gidx].rows.splice(insertAt,0,{
        id: nextCostId(),
        label: c.name,
        sub: c.date,
        budget: best.amount,
        currency: best.currency,
        display: ''
      });
      added++;
    });
    if(added>0){
      state.costDirty=true;
      syncCostGroups();
      renderCost();
      toast('已加入 '+added+' 個項目');
    }
    closeModal();
  });
}

// ─── INLINE EDIT (item fields) ─────────────────────────────────────────────
function startInlineEdit(el){
  if(!state.editMode)return;
  if(el.classList.contains('editing'))return;
  var field=el.getAttribute('data-field');
  var dayIdx=parseInt(el.getAttribute('data-day'),10);
  var itemIdx=el.hasAttribute('data-item')?parseInt(el.getAttribute('data-item'),10):null;
  var current=el.textContent;
  // For placeholder texts (italic), start empty
  if(el.style.fontStyle==='italic')current='';
  var orig=current;
  el.classList.add('editing');
  el.innerHTML='';
  var inp=document.createElement('input');
  inp.className='edit-input';
  inp.value=current;
  el.appendChild(inp);
  inp.focus();
  inp.select();
  var done=false;
  function commit(){
    if(done)return; done=true;
    var v=inp.value;
    el.classList.remove('editing');
    el.style.fontStyle='';
    el.style.color='';
    el.textContent=v;
    // Save into TRIP_DATA
    var d=TRIP_DATA[dayIdx];
    if(!d){return;}
    if(itemIdx!=null && field.indexOf('h')!==0){
      // item field: time/icon/name/desc
      d.items[itemIdx][field]=v;
    } else {
      // hotel field: hicon/hname/hdesc/hprice
      var map={hicon:'icon',hname:'name',hdesc:'desc',hprice:'price'};
      var realField=map[field]||field;
      if(!d.hotel)d.hotel={};
      d.hotel[realField]=v;
    }
    state.itinDirty=true;
    syncItin();
    // Re-render to show empty placeholder if cleared
    renderPanel(state.curDay);
  }
  function cancel(){
    if(done)return; done=true;
    el.classList.remove('editing');
    el.innerHTML=escHtml(orig);
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();commit();}
    else if(e.key==='Escape'){e.preventDefault();cancel();inp.blur();}
  });
}

// ─── DRAG & DROP (cards + day tabs) ────────────────────────────────────────
function bindDragHandlers(){
  var container=$id('panels-container');
  if(!container)return;
  container.addEventListener('dragstart',function(e){
    if(!state.editMode)return;
    var card=e.target.closest('.card');
    if(!card)return;
    if(card.hasAttribute('data-hotel'))return;  // hotel not draggable
    card.draggable=true;
    state.dragSrc=card;
    state.dragSrcDay=parseInt(card.getAttribute('data-day'),10);
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',card.getAttribute('data-item'));}catch(_e){}
  });
  container.addEventListener('dragover',function(e){
    if(!state.editMode||!state.dragSrc)return;
    e.preventDefault();
    var card=e.target.closest('.card');
    if(card && card!==state.dragSrc && !card.hasAttribute('data-hotel')){
      $qa('.card.drag-over').forEach(function(c){c.classList.remove('drag-over');});
      card.classList.add('drag-over');
    }
  });
  container.addEventListener('drop',function(e){
    if(!state.editMode||!state.dragSrc)return;
    e.preventDefault();
    var target=e.target.closest('.card');
    if(!target || target===state.dragSrc || target.hasAttribute('data-hotel')){cleanupDrag();return;}
    var srcIdx=parseInt(state.dragSrc.getAttribute('data-item'),10);
    var tgtIdx=parseInt(target.getAttribute('data-item'),10);
    if(state.dragSrcDay===state.curDay){
      // same day reorder
      var item=TRIP_DATA[state.curDay].items.splice(srcIdx,1)[0];
      TRIP_DATA[state.curDay].items.splice(tgtIdx,0,item);
      state.itinDirty=true;
      syncItin();
      renderPanel(state.curDay);
    }
    cleanupDrag();
  });
  container.addEventListener('dragend',function(e){
    cleanupDrag();
  });

  // Day tabs: drag tab to reorder day, OR drop card on tab to move item
  var tabsC=$id('day-tabs');
  if(tabsC){
    tabsC.addEventListener('dragstart',function(e){
      if(!state.editMode)return;
      var t=e.target.closest('.day-tab');
      if(!t)return;
      // If dragging a tab itself
      if(!state.dragSrc){
        state.dragSrc=t;
        state.dragSrcDay='__tab__';
        t.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
      }
    });
    tabsC.addEventListener('dragover',function(e){
      if(!state.editMode||!state.dragSrc)return;
      e.preventDefault();
      var t=e.target.closest('.day-tab');
      if(t && t!==state.dragSrc){
        $qa('.day-tab.drag-over').forEach(function(x){x.classList.remove('drag-over');});
        t.classList.add('drag-over');
      }
    });
    tabsC.addEventListener('drop',function(e){
      if(!state.editMode||!state.dragSrc)return;
      e.preventDefault();
      var t=e.target.closest('.day-tab');
      if(!t){cleanupDrag();return;}
      var tgtDay=parseInt(t.getAttribute('data-day'),10);

      if(state.dragSrcDay==='__tab__'){
        // reorder days
        var srcDay=parseInt(state.dragSrc.getAttribute('data-day'),10);
        if(srcDay!==tgtDay){
          var d=TRIP_DATA.splice(srcDay,1)[0];
          TRIP_DATA.splice(tgtDay,0,d);
          state.itinDirty=true;
          state.curDay=tgtDay;
          syncItin();
          renderTabs();
          renderPanel(state.curDay);
          bindTabEvents();
        }
      } else if(typeof state.dragSrcDay==='number' && state.dragSrcDay!==tgtDay){
        // cross-day item move
        var srcIdx=parseInt(state.dragSrc.getAttribute('data-item'),10);
        var item=TRIP_DATA[state.dragSrcDay].items.splice(srcIdx,1)[0];
        TRIP_DATA[tgtDay].items.push(item);
        state.itinDirty=true;
        syncItin();
        renderPanel(state.curDay);
        toast('已移至 '+TRIP_DATA[tgtDay].date);
      }
      cleanupDrag();
    });
  }
}

function cleanupDrag(){
  $qa('.dragging').forEach(function(x){x.classList.remove('dragging');});
  $qa('.drag-over').forEach(function(x){x.classList.remove('drag-over');});
  $qa('.card[draggable="true"]').forEach(function(c){c.draggable=false;});
  state.dragSrc=null;
  state.dragSrcDay=null;
}

// ─── DAY TAB EVENTS (click + long press) ───────────────────────────────────
function bindTabEvents(){
  $qa('.day-tab').forEach(function(t){
    t.addEventListener('click',function(){
      if(state.longPressTab===t){return;}  // suppress click after long-press
      switchDay(parseInt(t.getAttribute('data-day'),10));
    });
    // long press to delete day
    var startLP=function(){
      if(!state.editMode)return;
      state.longPressTimer=setTimeout(function(){
        state.longPressTab=t;
        deleteDay(parseInt(t.getAttribute('data-day'),10));
        setTimeout(function(){state.longPressTab=null;},300);
      },650);
    };
    var cancelLP=function(){clearTimeout(state.longPressTimer);};
    t.addEventListener('mousedown',startLP);
    t.addEventListener('touchstart',startLP,{passive:true});
    t.addEventListener('mouseup',cancelLP);
    t.addEventListener('mouseleave',cancelLP);
    t.addEventListener('touchend',cancelLP);
    t.addEventListener('touchcancel',cancelLP);
  });
}

// ─── SWIPE / KEYBOARD navigation ───────────────────────────────────────────
function bindSwipe(){
  var sx=0,sy=0,active=false;
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    var t=e.target;
    // Don't intercept inside sheets, inputs, or day-tabs
    if(t.closest('.sheet')||t.closest('input,textarea,select')||t.closest('.day-tabs-wrap'))return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; active=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!active)return; active=false;
    var tch=e.changedTouches[0]; if(!tch)return;
    var dx=tch.clientX-sx, dy=tch.clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0) switchDay(state.curDay+1);
      else switchDay(state.curDay-1);
    }
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target.closest('input,textarea,select'))return;
    if(e.key==='ArrowRight') switchDay(state.curDay+1);
    else if(e.key==='ArrowLeft') switchDay(state.curDay-1);
  });
}

// ─── GLOBAL CLICK DELEGATE ─────────────────────────────────────────────────
function bindGlobalClicks(){
  document.addEventListener('click',function(e){
    var t=e.target;

    // close sheet
    if(t.hasAttribute('data-close')||t.closest('[data-close]')){closeSheets();return;}

    // dp-btn (itin/map toggle)
    var dpBtn=t.closest('.dp-btn');
    if(dpBtn){switchView(dpBtn.getAttribute('data-view'));return;}

    // bnav
    var nav=t.closest('.bnav-btn');
    if(nav){handleNav(nav.getAttribute('data-nav'));return;}

    // edit mode actions
    if(state.editMode){
      // delete item card
      if(t.closest('[data-act="del-item"]')){
        var card=t.closest('.card');
        if(card){
          var di=parseInt(card.getAttribute('data-day'),10);
          var ii=parseInt(card.getAttribute('data-item'),10);
          deleteItem(di,ii);
        }
        return;
      }
      // add-between
      if(t.closest('[data-act="add-between"]')){
        var ab=t.closest('[data-act="add-between"]');
        handleAddBetween(parseInt(ab.getAttribute('data-day'),10),parseInt(ab.getAttribute('data-at'),10));
        return;
      }
      // inline edit
      if(t.hasAttribute('data-field')){startInlineEdit(t);return;}
    }

    // bs-todo toggle (works always, not just edit mode)
    var todo=t.closest('.bs-todo');
    if(todo){
      // del button
      if(t.closest('[data-act="del-todo"]')){
        if(state.editMode){
          var id=todo.getAttribute('data-id');
          // remove from BOOKING_DATA
          for(var i=0;i<BOOKING_DATA.length;i++){
            var sec=BOOKING_DATA[i];
            for(var j=0;j<sec.items.length;j++){
              if(sec.items[j].id===id){sec.items.splice(j,1);break;}
            }
          }
          state.bookDirty=true;
          syncBooking();
          renderBooking();
        }
        return;
      }
      // toggle done
      var tid=todo.getAttribute('data-id');
      var current=todo.classList.contains('done');
      state.todoStates[tid]=!current;
      todo.classList.toggle('done');
      syncTodos();
      updateProgress();
      return;
    }
  });

  // Double-click for cost edit
  document.addEventListener('dblclick',function(e){
    var am=e.target.closest('.am.editable');
    if(am){startCostEdit(am); return;}
    // E: double-click cost label/sub/group-title to edit text
    var tf=e.target.closest('[data-field="label"],[data-field="sub"],[data-field="group-title"]');
    if(tf){startCostTextEdit(tf); return;}
  });

  // Cost editing actions (delegated)
  var costList=$id('cost-list');
  if(costList){
    costList.addEventListener('click',function(e){
      var t=e.target;
      // A: delete row
      var delR=t.closest('[data-act="del-row"]');
      if(delR){
        delCostRow(parseInt(delR.getAttribute('data-gidx'),10), parseInt(delR.getAttribute('data-ridx'),10));
        return;
      }
      // A: delete group
      var delG=t.closest('[data-act="del-group"]');
      if(delG){
        delCostGroup(parseInt(delG.getAttribute('data-gidx'),10));
        return;
      }
      // A: add row
      var addR=t.closest('[data-act="add-row"]');
      if(addR){
        addCostRow(parseInt(addR.getAttribute('data-gidx'),10));
        return;
      }
      // A: add group
      if(t.closest('[data-act="add-group"]')){
        addCostGroup();
        return;
      }
    });
    // Currency change
    costList.addEventListener('change',function(e){
      var sel=e.target.closest('[data-act="curr"]');
      if(sel){
        setRowCurrency(parseInt(sel.getAttribute('data-gidx'),10), parseInt(sel.getAttribute('data-ridx'),10), sel.value);
      }
    });
    // Enable drag on rows in edit mode
    costList.addEventListener('mousedown',function(e){
      if(!state.editMode)return;
      var dh=e.target.closest('.cs-drag-handle');
      if(dh){
        var row=dh.closest('.cs-row');
        if(row)row.draggable=true;
      }
    });
    costList.addEventListener('touchstart',function(e){
      if(!state.editMode)return;
      var dh=e.target.closest('.cs-drag-handle');
      if(dh){
        var row=dh.closest('.cs-row');
        if(row)row.draggable=true;
      }
    },{passive:true});
  }
}
